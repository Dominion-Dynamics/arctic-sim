# Sites built by `docker compose up`. One per line:
#
#   name        lat          lon           extent_m   [grid]
#
# Coordinates are decimal degrees. Omit grid to have it chosen to match
# ArcticDEM's 10 m posting. Anything already built is skipped, so adding a line
# and running `docker compose up` only downloads the new one.
#
# SITE_NAME in .env selects which of these the sim actually loads.
#
# `./arctic add` appends here for you.

